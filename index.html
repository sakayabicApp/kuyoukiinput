<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空容器登録アプリ</title>
  <style>
    :root {
      --primary-color: #0051c3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #ccc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
      color: #333;
    }
    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
    }
    
    /* -----------------------------------
       1/3 と 2/3 の横並びグリッドレイアウト
    ----------------------------------- */
    .search-display-grid {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: flex-start;
    }
    .col-1-3 {
      flex: 1; /* 横幅 1/3 */
      position: relative;
    }
    .col-2-3 {
      flex: 2; /* 横幅 2/3 */
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    /* 確定情報表示パネル (2/3側) */
    .info-panel {
      padding: 10px 14px;
      background: #f0f4f9;
      border: 1px solid #d0dbe8;
      border-radius: 4px;
      min-height: 20px;
      font-size: 15px;
      font-weight: bold;
      color: #1967d2;
      display: flex;
      align-items: center;
    }
    .info-panel.empty {
      color: #888;
      font-weight: normal;
      background: #fafafa;
      border-style: dashed;
    }

    /* サジェストウィンドウ共通 */
    .suggest-window {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 220px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--primary-color);
      border-top: none;
      border-radius: 0 0 6px 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      display: none;
    }
    .suggest-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .suggest-item:hover { background-color: #e8f0fe; }
    .suggest-item .code { font-weight: bold; color: var(--primary-color); margin-right: 6px; }

    /* -----------------------------------
       空容器マスターテーブルのスタイル
    ----------------------------------- */
    .table-container {
      overflow-x: auto;
      margin-top: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }
    th {
      background-color: #f8f9fa;
      color: #555;
      font-weight: bold;
      white-space: nowrap;
    }
    tr:hover { background-color: #f9fbfd; }
    .price-col { text-align: right; }
    .qty-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 130px;
    }
    .qty-cell input {
      width: 70px;
      text-align: right;
      padding: 6px 8px;
    }
    .unit-text {
      font-size: 13px;
      color: #555;
      white-space: nowrap;
    }

    /* 送信ボタン */
    .action-area {
      margin-top: 20px;
      text-align: right;
    }
    button[type="submit"] {
      background-color: var(--primary-color);
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button[type="submit"]:hover { background-color: #003da1; }
    button[type="submit"]:disabled { background-color: #ccc; cursor: not-allowed; }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 4px;
      display: none;
      font-weight: bold;
    }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="container">
    <h2>空容器登録</h2>

    <form id="registerForm">
      
      <!-- 出荷店エリア (1/3 検索 : 2/3 表示) -->
      <label>出荷店:</label>
      <div class="search-display-grid">
        <div class="col-1-3">
          <input type="text" id="storeSearch" placeholder="コード・名で検索" autocomplete="off">
          <div id="storeSuggest" class="suggest-window"></div>
          <input type="hidden" id="selectedStoreCode" required>
          <input type="hidden" id="selectedStoreName">
        </div>
        <div class="col-2-3">
          <div id="storeDisplay" class="info-panel empty">未選択（左から検索・選択）</div>
        </div>
      </div>

      <!-- 得意先エリア (1/3 検索 : 2/3 表示) -->
      <label>得意先:</label>
      <div class="search-display-grid">
        <div class="col-1-3">
          <input type="text" id="customerSearch" placeholder="コード・名・カナ検索" autocomplete="off">
          <div id="customerSuggest" class="suggest-window"></div>
          <input type="hidden" id="selectedCustomerCode" required>
          <input type="hidden" id="selectedCustomerName">
        </div>
        <div class="col-2-3">
          <div id="customerDisplay" class="info-panel empty">未選択（左から検索・選択）</div>
        </div>
      </div>

      <!-- 備考欄 -->
      <div style="margin-bottom: 20px;">
        <label for="note">備考 / メモ:</label>
        <input type="text" id="note" placeholder="備考があれば入力">
      </div>

      <!-- 空容器マスターテーブル -->
      <label>空容器入力（数量直接入力）:</label>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>商品コード</th>
              <th>JANコード</th>
              <th>空容器名</th>
              <th class="price-col">単価</th>
              <th style="text-align: center;">数量入力</th>
            </tr>
          </thead>
          <tbody id="containerTableBody">
            <tr>
              <td colspan="5" style="text-align:center; color:#888;">マスターデータを読み込んでいます...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="action-area">
        <button type="submit" id="submitBtn">一括送信する</button>
      </div>
    </form>

    <div id="message"></div>
  </div>

  <script>
    // ★ご自身の GAS Webアプリ URL を設定してください
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbylyTuJ9jLaUISlpeKI5xVGOoeXl8XMh9e4lM_bmNAPTsw4N8LnVt4m2vDOgqMx7kRZlQ/exec';

    let masterStores = [];
    let masterCustomers = [];
    let masterContainers = [];

    // 初期ロード
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const result = await response.json();

        if (result.status === 'success') {
          masterStores = result.data.stores;
          masterCustomers = result.data.customers;
          masterContainers = result.data.containers;

          renderContainerTable(masterContainers);
        } else {
          showMessage('マスターデータの取得に失敗しました', true);
        }
      } catch (err) {
        console.error('マスター取得エラー:', err);
        showMessage('通信エラーが発生しました。GASのURL・設定を確認してください。', true);
      }
    });

    // ----------------------------------------------------
    // 空容器テーブルの描画
    // A:商品コード, B:JANコード, C:空容器名, D:単価, E:単位
    // ----------------------------------------------------
    function renderContainerTable(containers) {
      const tbody = document.getElementById('containerTableBody');
      tbody.innerHTML = '';

      if (!containers || containers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">データがありません</td></tr>';
        return;
      }

      containers.forEach((item, index) => {
        const keys = Object.keys(item);
        const code  = item[keys[0]] || ''; // A列
        const jan   = item[keys[1]] || ''; // B列
        const name  = item[keys[2]] || ''; // C列
        const price = item[keys[3]] !== undefined ? item[keys[3]] : ''; // D列
        const unit  = item[keys[4]] || '個'; // E列（単位）

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${code}</strong></td>
          <td>${jan}</td>
          <td>${name}</td>
          <td class="price-col">${price ? Number(price).toLocaleString() + '円' : ''}</td>
          <td>
            <div class="qty-cell">
              <input type="number" class="container-qty" min="0" placeholder="0" 
                     data-code="${code}" data-name="${name}" data-unit="${unit}">
              <span class="unit-text">${unit}</span>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ----------------------------------------------------
    // 1/3 検索 window & 2/3 表示パネル共通関数
    // ----------------------------------------------------
    function setupSuggest(inputId, suggestId, codeHiddenId, nameHiddenId, displayId, getMasterData, searchFields) {
      const input = document.getElementById(inputId);
      const suggest = document.getElementById(suggestId);
      const codeHidden = document.getElementById(codeHiddenId);
      const nameHidden = document.getElementById(nameHiddenId);
      const display = document.getElementById(displayId);

      input.addEventListener('input', () => {
        const keyword = input.value.trim().toLowerCase();
        suggest.innerHTML = '';

        if (!keyword) {
          suggest.style.display = 'none';
          return;
        }

        const master = getMasterData();
        const filtered = master.filter(item => {
          const values = Object.values(item).map(v => String(v).toLowerCase());
          return searchFields.some(idx => values[idx] && values[idx].includes(keyword));
        });

        if (filtered.length === 0) {
          suggest.innerHTML = '<div class="suggest-item" style="color:#999;">該当なし</div>';
          suggest.style.display = 'block';
          return;
        }

        filtered.forEach(item => {
          const keys = Object.keys(item);
          const code = item[keys[0]] || '';
          const name = item[keys[1]] || '';
          const extra = item[keys[2]] ? `(${item[keys[2]]})` : '';

          const div = document.createElement('div');
          div.className = 'suggest-item';
          div.innerHTML = `<span class="code">${code}</span> ${name} ${extra}`;

          div.addEventListener('click', () => {
            // 値の確定
            codeHidden.value = code;
            nameHidden.value = name;

            // 右側 2/3 パネルの表示を更新
            display.textContent = `[${code}] ${name}`;
            display.classList.remove('empty');

            // 検索窓をクリアしてウインドウを閉じる
            input.value = '';
            suggest.style.display = 'none';
          });

          suggest.appendChild(div);
        });

        suggest.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#' + inputId) && !e.target.closest('#' + suggestId)) {
          suggest.style.display = 'none';
        }
      });
    }

    // セットアップ実行
    setupSuggest('storeSearch', 'storeSuggest', 'selectedStoreCode', 'selectedStoreName', 'storeDisplay', () => masterStores, [0, 1]);
    setupSuggest('customerSearch', 'customerSuggest', 'selectedCustomerCode', 'selectedCustomerName', 'customerDisplay', () => masterCustomers, [0, 1, 2]);

    // ----------------------------------------------------
    // 送信処理（数量が1以上の空容器を一括送信）
    // ----------------------------------------------------
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const storeCode = document.getElementById('selectedStoreCode').value;
      const customerCode = document.getElementById('selectedCustomerCode').value;

      if (!storeCode) {
        alert('出荷店を選択してください。');
        return;
      }
      if (!customerCode) {
        alert('得意先を選択してください。');
        return;
      }

      // テーブルから数量が入っている行を抽出
      const qtyInputs = document.querySelectorAll('.container-qty');
      const itemsToSubmit = [];

      qtyInputs.forEach(input => {
        const qty = parseInt(input.value, 10);
        if (qty > 0) {
          itemsToSubmit.push({
            containerCode: input.dataset.code,
            containerName: input.dataset.name,
            quantity: qty,
            unit: input.dataset.unit
          });
        }
      });

      if (itemsToSubmit.length === 0) {
        alert('1つ以上の空容器の数量を入力してください。');
        return;
      }

      const payload = {
        storeCode: storeCode,
        storeName: document.getElementById('selectedStoreName').value,
        customerCode: customerCode,
        customerName: document.getElementById('selectedCustomerName').value,
        note: document.getElementById('note').value,
        items: itemsToSubmit // 配列で送信
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          showMessage('スプレッドシートへ一括書き込みました！', false);
          
          // 数量入力フィールドをリセット
          qtyInputs.forEach(input => input.value = '');
          document.getElementById('note').value = '';
        } else {
          showMessage('保存失敗: ' + result.message, true);
        }
      } catch (err) {
        showMessage('送信エラーが発生しました。', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '一括送信する';
      }
    });

    function showMessage(msg, isError) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = isError ? 'error' : 'success';
      msgDiv.style.display = 'block';
    }
  </script>
</body>
</html>
