<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空容器登録アプリ</title>
  <style>
    :root {
      --primary-color: #0051c3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #ccc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
      color: #333;
    }
    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"], select, button {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    /* 数量と単位の横並びレイアウト */
    .qty-group {
      display: flex;
      gap: 10px;
    }
    .qty-group input[type="number"] {
      flex: 2;
    }
    .qty-group select {
      flex: 1;
    }
    
    /* サジェストウィンドウ共通スタイル */
    .search-container {
      position: relative;
    }
    .suggest-window {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 220px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--primary-color);
      border-top: none;
      border-radius: 0 0 6px 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      display: none;
    }
    .suggest-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .suggest-item:last-child {
      border-bottom: none;
    }
    .suggest-item:hover {
      background-color: #f0f4f9;
    }
    .suggest-item .code {
      font-weight: bold;
      color: var(--primary-color);
      margin-right: 8px;
    }
    .suggest-item .sub {
      font-size: 12px;
      color: #666;
      margin-left: 6px;
    }

    /* 選択確定時のバッジ表示 */
    .selected-badge {
      margin-top: 6px;
      padding: 6px 10px;
      background: #e8f0fe;
      color: #1967d2;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }

    button[type="submit"] {
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button[type="submit"]:hover {
      background-color: #003da1;
    }
    #message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div class="container">
    <h2>空容器登録</h2>

    <form id="registerForm">
      
      <!-- 1. 出荷店検索（コード・店名） -->
      <div class="form-group">
        <label for="storeSearch">出荷店（コード・店名で検索）:</label>
        <div class="search-container">
          <input type="text" id="storeSearch" placeholder="出荷店コードまたは店名を入力" autocomplete="off">
          <div id="storeSuggest" class="suggest-window"></div>
        </div>
        <input type="hidden" id="selectedStoreCode" required>
        <input type="hidden" id="selectedStoreName">
        <div id="storeBadge" class="selected-badge"></div>
      </div>

      <!-- 2. 得意先検索（コード・名前・カナ） -->
      <div class="form-group">
        <label for="customerSearch">得意先（コード・名前・カナで検索）:</label>
        <div class="search-container">
          <input type="text" id="customerSearch" placeholder="得意先コード・名前・カナを入力" autocomplete="off">
          <div id="customerSuggest" class="suggest-window"></div>
        </div>
        <input type="hidden" id="selectedCustomerCode" required>
        <input type="hidden" id="selectedCustomerName">
        <div id="customerBadge" class="selected-badge"></div>
      </div>

      <!-- 3. 空容器（商品コード・JANコード・商品名を表示するセレクトボックス） -->
      <div class="form-group">
        <label for="containerSelect">空容器選択:</label>
        <select id="containerSelect" required>
          <option value="">マスター読み込み中...</option>
        </select>
      </div>

      <!-- 4. 数量 ＋ 単位（バラ / ケース） -->
      <div class="form-group">
        <label for="quantity">数量 & 単位:</label>
        <div class="qty-group">
          <input type="number" id="quantity" min="1" placeholder="数量" required>
          <select id="unitSelect" required>
            <option value="バラ">バラ</option>
            <option value="ケース">ケース</option>
          </select>
        </div>
      </div>

      <!-- 5. 備考 -->
      <div class="form-group">
        <label for="note">備考:</label>
        <input type="text" id="note" placeholder="メモ・特記事項">
      </div>

      <button type="submit" id="submitBtn">スプレッドシートへ送信</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    // ★ GASのデプロイURLを設定してください
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/YOUR_GAS_DEPLOYMENT_ID/exec';

    let masterStores = [];
    let masterCustomers = [];

    // 初期データ読み込み
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const result = await response.json();

        if (result.status === 'success') {
          masterStores = result.data.stores;
          masterCustomers = result.data.customers;

          // 空容器マスターのセレクトボックスを生成
          populateContainerSelect(result.data.containers);
        }
      } catch (err) {
        console.error('マスター取得エラー:', err);
      }
    });

    // 空容器マスターのドロップダウン生成（商品コード・JAN・商品名をすべて網羅）
    function populateContainerSelect(containers) {
      const select = document.getElementById('containerSelect');
      select.innerHTML = '<option value="">-- 空容器を選択してください --</option>';

      containers.forEach(item => {
        const keys = Object.keys(item);
        const code = item[keys[0]] || ''; // 商品コード
        const jan  = item[keys[1]] || ''; // JANコード
        const name = item[keys[2]] || item[keys[1]] || item[keys[0]] || ''; // 商品名

        const opt = document.createElement('option');
        opt.value = code;
        // 例: 「[B001] ビールケース (JAN: 4900000000000)」の表示
        const janText = jan ? ` (JAN: ${jan})` : '';
        opt.textContent = `[${code}] ${name}${janText}`;
        opt.dataset.name = name;
        select.appendChild(opt);
      });
    }

    // ----------------------------------------------------
    // 汎用サジェスト検索・確定設定関数
    // ----------------------------------------------------
    function setupSuggest(inputId, suggestId, codeHiddenId, nameHiddenId, badgeId, getMasterData, searchFields) {
      const input = document.getElementById(inputId);
      const suggest = document.getElementById(suggestId);
      const codeHidden = document.getElementById(codeHiddenId);
      const nameHidden = document.getElementById(nameHiddenId);
      const badge = document.getElementById(badgeId);

      input.addEventListener('input', () => {
        const keyword = input.value.trim().toLowerCase();
        suggest.innerHTML = '';

        if (!keyword) {
          suggest.style.display = 'none';
          return;
        }

        const master = getMasterData();
        const filtered = master.filter(item => {
          const values = Object.values(item).map(v => String(v).toLowerCase());
          return searchFields.some(index => values[index] && values[index].includes(keyword));
        });

        if (filtered.length === 0) {
          suggest.innerHTML = '<div class="suggest-item" style="color:#999;">該当するデータがありません</div>';
          suggest.style.display = 'block';
          return;
        }

        filtered.forEach(item => {
          const keys = Object.keys(item);
          const code = item[keys[0]] || '';
          const name = item[keys[1]] || '';
          const extra = item[keys[2]] ? `(${item[keys[2]]})` : '';

          const div = document.createElement('div');
          div.className = 'suggest-item';
          div.innerHTML = `<span class="code">${code}</span> ${name} <span class="sub">${extra}</span>`;

          // クリック時の確定処理
          div.addEventListener('click', () => {
            codeHidden.value = code;
            nameHidden.value = name;
            
            // 選択後、検索入力窓はクリアする
            input.value = '';
            suggest.style.display = 'none';

            // バッジで選択状態を表示
            badge.textContent = `選択中: [${code}] ${name}`;
            badge.style.display = 'block';
          });

          suggest.appendChild(div);
        });

        suggest.style.display = 'block';
      });

      // エリア外クリックでウインドウを閉じる
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#' + inputId) && !e.target.closest('#' + suggestId)) {
          suggest.style.display = 'none';
        }
      });
    }

    // 出荷店検索のセットアップ（A列:0, B列:1）
    setupSuggest('storeSearch', 'storeSuggest', 'selectedStoreCode', 'selectedStoreName', 'storeBadge', () => masterStores, [0, 1]);

    // 得意先検索のセットアップ（A列:0, B列:1, C列:2）
    setupSuggest('customerSearch', 'customerSuggest', 'selectedCustomerCode', 'selectedCustomerName', 'customerBadge', () => masterCustomers, [0, 1, 2]);

    // ----------------------------------------------------
    // フォーム送信処理
    // ----------------------------------------------------
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const storeCode = document.getElementById('selectedStoreCode').value;
      const customerCode = document.getElementById('selectedCustomerCode').value;
      
      if (!storeCode) {
        alert('出荷店を検索・選択してください。');
        return;
      }
      if (!customerCode) {
        alert('得意先を検索・選択してください。');
        return;
      }

      const containerSelect = document.getElementById('containerSelect');
      const selectedContainerOption = containerSelect.options[containerSelect.selectedIndex];

      const payload = {
        storeCode: storeCode,
        storeName: document.getElementById('selectedStoreName').value,
        customerCode: customerCode,
        customerName: document.getElementById('selectedCustomerName').value,
        containerCode: containerSelect.value,
        containerName: selectedContainerOption.dataset.name || '',
        quantity: document.getElementById('quantity').value,
        unit: document.getElementById('unitSelect').value, // バラ or ケース
        note: document.getElementById('note').value
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          showMessage('スプレッドシートへ書き込みました！', false);
          
          // フォームリセットとバッジの初期化
          document.getElementById('registerForm').reset();
          document.getElementById('selectedStoreCode').value = '';
          document.getElementById('selectedCustomerCode').value = '';
          document.getElementById('storeBadge').style.display = 'none';
          document.getElementById('customerBadge').style.display = 'none';
        } else {
          showMessage('保存失敗: ' + result.message, true);
        }
      } catch (err) {
        showMessage('送信エラーが発生しました。', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'スプレッドシートへ送信';
      }
    });

    function showMessage(msg, isError) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = isError ? 'error' : 'success';
      msgDiv.style.display = 'block';
    }
  </script>
</body>
</html>
