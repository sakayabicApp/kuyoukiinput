<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空容器管理システム</title>
<style>
  :root {
    --primary-color: #0051c3;
    --bg-color: #f4f7f6;
    --card-bg: #ffffff;
    --border-color: #ccc;
  }
  
  html { font-size: 16px; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    max-width: 950px;
    margin: 0.9375rem auto;
    padding: 0 0.625rem;
    color: #333;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* 上部ナビゲーションタブ */
  .nav-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    border-bottom: 2px solid var(--primary-color);
  }
  .nav-tab {
    padding: 0.625rem 1.25rem;
    background: #e0e0e0;
    border: none;
    border-top-left-radius: 0.375rem;
    border-top-right-radius: 0.375rem;
    cursor: pointer;
    font-weight: bold;
    color: #555;
  }
  .nav-tab.active {
    background: var(--primary-color);
    color: #ffffff;
  }

  .container {
    background: var(--card-bg);
    padding: 1.25rem;
    border-radius: 0.5rem;
    box-shadow: 0 0.125rem 0.5rem rgba(0,0,0,0.1);
  }

  .header-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding-bottom: 0.5rem;
    margin-bottom: 1rem;
  }

  h2 { margin: 0; color: var(--primary-color); font-size: 1.25rem; }

  .user-badge {
    font-size: 0.875rem;
    background: #e8f0fe;
    color: var(--primary-color);
    padding: 0.375rem 0.75rem;
    border-radius: 1rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .btn-logout {
    background: none; border: none; color: #d93025;
    cursor: pointer; font-size: 0.75rem; text-decoration: underline; padding: 0;
  }

  .search-display-grid {
    display: flex; flex-direction: row; gap: 0.9375rem; margin-bottom: 1.25rem; align-items: flex-start;
  }
  .col-1-3 { flex: 1; position: relative; width: 100%; }
  .col-2-3 { flex: 2; width: 100%; }

  label { display: block; font-weight: bold; margin-bottom: 0.375rem; font-size: 0.875rem; }
  input[type="text"], input[type="number"], input[type="date"], input[type="password"], select {
    width: 100%; padding: 0.625rem 0.75rem; font-size: 0.9375rem;
    box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 0.25rem;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; text-align: left; }
  th, td { padding: 0.5rem 0.625rem; border: 1px solid #e0e0e0; vertical-align: middle; word-break: break-all; }
  th { background-color: #f8f9fa; color: #555; font-weight: bold; }

  .table-container table { table-layout: fixed; width: 100%; }
  .table-container th:nth-child(1) { width: 18%; }
  .table-container th:nth-child(2) { width: 22%; }
  .table-container th:nth-child(3) { width: 33%; }
  .table-container th:nth-child(4) { width: 13%; }
  .table-container th:nth-child(5) { width: 14%; }

  .display-table-container { background: #ffffff; border-radius: 0.25rem; overflow-x: auto; }
  .display-table td { background-color: #f0f4f9; color: #1967d2; font-weight: bold; }
  .display-table td.empty-td { background-color: #fafafa; color: #888; font-weight: normal; text-align: center; }

  .suggest-window {
    position: absolute; top: 100%; left: 0; right: 0;
    max-height: 13.75rem; overflow-y: auto; background: #ffffff;
    border: 1px solid var(--primary-color); border-top: none;
    border-radius: 0 0 0.375rem 0.375rem; box-shadow: 0 0.25rem 0.625rem rgba(0,0,0,0.15);
    z-index: 1000; display: none;
  }
  .suggest-item { padding: 0.625rem 0.75rem; cursor: pointer; border-bottom: 1px solid #eee; font-size: 0.8125rem; }
  .suggest-item:hover { background-color: #e8f0fe; }
  .suggest-item .code { font-weight: bold; color: var(--primary-color); margin-right: 0.375rem; }

  .table-container { overflow-x: auto; margin-top: 0.625rem; border: 1px solid #e0e0e0; border-radius: 0.375rem; }
  .price-col { text-align: right; }
  .qty-cell { display: flex; align-items: center; gap: 0.375rem; }
  .qty-cell input { padding: 0.375rem; text-align: right; }
  .unit-text { font-size: 0.75rem; color: #555; white-space: nowrap; }

  .action-area { margin-top: 1.25rem; text-align: right; }
  button.btn-primary {
    background-color: var(--primary-color); color: white; font-size: 1rem; font-weight: bold;
    padding: 0.75rem 1.75rem; border: none; border-radius: 0.25rem; cursor: pointer;
    width: 100%; max-width: 18.75rem; transition: background 0.2s;
  }
  button.btn-primary:hover { background-color: #003da1; }
  button.btn-secondary {
    background-color: #6c757d; color: white; font-size: 0.9375rem; font-weight: bold;
    padding: 0.625rem 1.25rem; border: none; border-radius: 0.25rem; cursor: pointer;
  }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); display: none;
    justify-content: center; align-items: center; z-index: 2000; padding: 0.9375rem;
  }
  .modal-content {
    background: #ffffff; width: 100%; max-width: 34.375rem;
    border-radius: 0.5rem; padding: 1.25rem; box-shadow: 0 0.25rem 0.9375rem rgba(0,0,0,0.2);
    max-height: 85vh; overflow-y: auto;
  }
  .modal-header { font-size: 1.125rem; font-weight: bold; color: var(--primary-color); margin-bottom: 0.75rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
  .confirm-table { margin-bottom: 0.9375rem; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.625rem; margin-top: 1.25rem; }

  .page-section { display: none; }
  .page-section.active { display: block; }
</style>
</head>
<body>

  <div id="loadingOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;">
    <div class="spinner" style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #0051c3; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
    <p style="font-size: 1.2rem; font-weight: bold; color: #333; margin: 0;">起動中です...</p>
    <p style="font-size: 0.9rem; color: #666; margin-top: 8px;">マスターデータを読み込んでいます</p>
  </div>

  <div id="loginModal" class="modal-overlay" style="display: flex; z-index: 3000;">
    <div class="modal-content" style="max-width: 360px;">
      <div class="modal-header" style="text-align: center;">ログイン</div>
      <form id="loginForm">
        <div style="margin-bottom: 12px;">
          <label for="loginUserId">ユーザーID:</label>
          <input type="text" id="loginUserId" placeholder="ユーザーIDを入力" required autocomplete="username">
        </div>
        <div style="margin-bottom: 20px;">
          <label for="loginPassword">パスワード:</label>
          <input type="password" id="loginPassword" placeholder="パスワードを入力" required autocomplete="current-password">
        </div>
        <div id="loginError" style="color: red; font-size: 13px; margin-bottom: 12px; display: none; text-align: center;"></div>
        <button type="submit" id="loginBtn" class="btn-primary" style="width: 100%; max-width: none;">ログイン</button>
      </form>
    </div>
  </div>

  <!-- 上部メニュータブ -->
  <div class="nav-tabs">
    <button type="button" class="nav-tab active" onclick="switchPage('register')">空容器登録</button>
    <button type="button" class="nav-tab" onclick="switchPage('report')">帳票PDF出力</button>
  </div>

  <div class="container">
    <div class="header-area">
      <h2 id="pageTitle">空容器登録</h2>
      <div id="userBadge" class="user-badge" style="display: none;">
        <span>登録者: <strong id="currentUserName">-</strong></span>
        <button type="button" class="btn-logout" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <!-- ページ1: 登録画面 -->
    <div id="pageRegister" class="page-section active">
      <form id="registerForm">
        <div class="search-display-grid">
          <div style="flex: 1;">
            <label for="slipDate">伝票日付:</label>
            <input type="date" id="slipDate" required>
          </div>
        </div>

        <label>得意先選択:</label>
        <div class="search-display-grid">
          <div class="col-1-3">
            <input type="text" id="customerSearch" placeholder="得意先コード・名称・カナ検索" autocomplete="off">
            <div id="customerSuggest" class="suggest-window"></div>
            <input type="hidden" id="selectedCustomerCode" required>
            <input type="hidden" id="selectedCustomerName">
            <input type="hidden" id="selectedRouteCode">
            <input type="hidden" id="selectedRouteName">
            <input type="hidden" id="selectedStaffCode">
            <input type="hidden" id="selectedStaffName">
          </div>
          <div class="col-2-3">
            <div class="display-table-container">
              <table class="display-table">
                <thead>
                  <tr>
                    <th>得意先コード</th><th>得意先名</th><th>ルートコード</th><th>配送ルート名</th><th>担当者コード</th><th>担当者</th>
                  </tr>
                </thead>
                <tbody>
                  <tr id="customerDisplayRow">
                    <td colspan="6" class="empty-td">未選択（左の検索窓から選択）</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <label>出荷店選択:</label>
        <div class="search-display-grid">
          <div class="col-1-3">
            <input type="text" id="storeSearch" placeholder="出荷店コード・名称で検索" autocomplete="off">
            <div id="storeSuggest" class="suggest-window"></div>
            <input type="hidden" id="selectedStoreCode" required>
            <input type="hidden" id="selectedStoreName">
          </div>
          <div class="col-2-3">
            <div class="display-table-container">
              <table class="display-table">
                <thead>
                  <tr><th style="width: 35%;">出荷店コード</th><th>出荷店名</th></tr>
                </thead>
                <tbody>
                  <tr id="storeDisplayRow">
                    <td colspan="2" class="empty-td">未選択（得意先選択で自動反映・変更可）</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <label>空容器数量入力（入力後、下の送信ボタンで確定）:</label>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>商品コード</th><th>JANコード</th><th>空容器名</th><th class="price-col">単価</th><th style="text-align: center;">数量入力</th>
              </tr>
            </thead>
            <tbody id="containerTableBody">
              <tr><td colspan="5" style="text-align:center; color:#888;">マスターデータを読み込んでいます...</td></tr>
            </tbody>
          </table>
        </div>

        <div style="margin-bottom: 20px; margin-top: 15px;">
          <label for="note">備考 / メモ:</label>
          <input type="text" id="note" placeholder="備考があれば入力">
        </div>

        <div class="action-area">
          <button type="button" id="openConfirmBtn" class="btn-primary">データ送信</button>
        </div>
      </form>
    </div>

    <!-- ページ2: 帳票PDF出力画面 -->
    <div id="pageReport" class="page-section">
      <div style="padding: 1rem; background: #f8f9fa; border-radius: 0.375rem; border: 1px solid #e0e0e0;">
        <label for="periodSelect">対象期間:</label>
        <select id="periodSelect" style="max-width: 250px; margin-bottom: 1rem;">
          <option value="30">1ヶ月以内</option>
          <option value="60">2ヶ月以内</option>
          <option value="90">3ヶ月以内</option>
        </select>
        <p style="color: #666; font-size: 0.875rem;">※帳票出力機能は現在準備中です。</p>
      </div>
    </div>

  </div>

  <div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">送信内容の確認</div>
      <p style="font-size: 14px; margin-bottom: 10px;">以下の内容で送信します。よろしいですか？</p>
      
      <table class="confirm-table">
        <tr><th style="width: 30%;">伝票日付</th><td id="modalSlipDateStr"></td></tr>
        <tr><th>登録者名</th><td id="modalRegistrantStr"></td></tr>
        <tr><th>得意先</th><td id="modalCustomerStr"></td></tr>
        <tr><th>配送ルート</th><td id="modalRouteStr"></td></tr>
        <tr><th>担当者</th><td id="modalStaffStr"></td></tr>
        <tr><th>出荷店</th><td id="modalStoreStr"></td></tr>
        <tr><th>備考</th><td id="modalNoteStr"></td></tr>
      </table>

      <label>登録する空容器一覧:</label>
      <div class="table-container" style="max-height: 180px; overflow-y: auto;">
        <table>
          <thead>
            <tr><th>商品コード</th><th>空容器名</th><th style="text-align: right; width: 100px;">数量</th></tr>
          </thead>
          <tbody id="modalItemsBody"></tbody>
        </table>
      </div>

      <div class="modal-actions">
        <button type="button" id="modalCancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="modalSubmitBtn" class="btn-primary" style="width: auto;">送信確定</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbylyTuJ9jLaUISlpeKI5xVGOoeXl8XMh9e4lM_bmNAPTsw4N8LnVt4m2vDOgqMx7kRZlQ/exec';

    let masterStores = [];
    let masterCustomers = [];
    let masterContainers = [];
    let masterRoutes = {};
    let masterStaffs = {};

    let currentUserName = '';
    let currentPayload = null;

    // 上部メニュー切り替え
    function switchPage(pageType) {
      const tabs = document.querySelectorAll('.nav-tab');
      tabs.forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));

      if (pageType === 'register') {
        tabs[0].classList.add('active');
        document.getElementById('pageRegister').classList.add('active');
        document.getElementById('pageTitle').textContent = '空容器登録';
      } else {
        tabs[1].classList.add('active');
        document.getElementById('pageReport').classList.add('active');
        document.getElementById('pageTitle').textContent = '帳票PDF出力';
      }
    }

    // 初期ロード
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('slipDate').value = today;

      checkLogin();
      loadMasterData();
      setupStoreSuggest();
      setupCustomerSuggest();
    });

    function checkLogin() {
      const savedUser = localStorage.getItem('containerAppUserName');
      if (savedUser) {
        currentUserName = savedUser;
        document.getElementById('currentUserName').textContent = currentUserName;
        document.getElementById('userBadge').style.display = 'flex';
        document.getElementById('loginModal').style.display = 'none';
      } else {
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('loginUserId').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');

      errorDiv.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = '認証中...';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'login', userId: userId, password: password })
        });
        const result = await response.json();

        if (result.status === 'success') {
          currentUserName = result.userName;
          localStorage.setItem('containerAppUserName', currentUserName);
          checkLogin();
        } else {
          errorDiv.textContent = result.message || 'ログインエラー';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        console.error('ログイン通信エラー:', err);
        errorDiv.textContent = '通信エラーが発生しました。';
        errorDiv.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'ログイン';
      }
    });

    function logout() {
      localStorage.removeItem('containerAppUserName');
      currentUserName = '';
      document.getElementById('userBadge').style.display = 'none';
      document.getElementById('loginModal').style.display = 'flex';
    }

    // マスターデータ読み込み（GASリダイレクト対応）
    async function loadMasterData() {
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getData`, {
          method: 'GET',
          redirect: 'follow'
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          masterStores = result.data.stores || [];
          masterCustomers = result.data.customers || [];
          masterContainers = result.data.containers || [];

          if (result.data.routes) {
            result.data.routes.forEach(row => {
              const keys = Object.keys(row);
              const code = String(row[keys[0]] || '').trim();
              const name = String(row[keys[1]] || '').trim();
              if (code) masterRoutes[code] = name;
            });
          }

          if (result.data.staffs) {
            result.data.staffs.forEach(row => {
              const keys = Object.keys(row);
              const code = String(row[keys[0]] || '').trim();
              const name = String(row[keys[1]] || '').trim();
              if (code) masterStaffs[code] = name;
            });
          }

          renderContainerTable(masterContainers);

          const loadingOverlay = document.getElementById('loadingOverlay');
          if (loadingOverlay) loadingOverlay.style.display = 'none';
        } else {
          showLoadingError('マスターデータの取得に失敗しました: ' + (result.message || ''));
        }
      } catch (err) {
        console.error('マスター取得エラー:', err);
        showLoadingError('通信エラーが発生しました。GASのURL・設定を確認してください。');
      }
    }

    function showLoadingError(msg) {
      const loadingOverlay = document.getElementById('loadingOverlay');
      if (loadingOverlay) {
        loadingOverlay.innerHTML = `<p style="color:red; font-weight:bold; padding:20px; text-align:center;">${msg}<br><br>ページを再読み込みしてください。</p>`;
      }
    }

    function renderContainerTable(containers) {
      const tbody = document.getElementById('containerTableBody');
      tbody.innerHTML = '';
      if (!containers || containers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">データがありません</td></tr>';
        return;
      }

      containers.forEach(item => {
        const keys = Object.keys(item);
        const code  = item[keys[0]] || ''; 
        const jan   = item[keys[1]] || ''; 
        const name  = item[keys[2]] || ''; 
        const price = item[keys[3]] !== undefined ? item[keys[3]] : ''; 
        const unit  = item[keys[4]] || '個'; 

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${code}</strong></td>
          <td>${jan}</td>
          <td>${name}</td>
          <td class="price-col">${price ? Number(price).toLocaleString() + '円' : ''}</td>
          <td>
            <div class="qty-cell">
              <input type="number" class="container-qty" min="0" placeholder="0" 
                     data-code="${code}" data-name="${name}" data-unit="${unit}">
              <span class="unit-text">${unit}</span>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function setStoreSelect(code, name) {
      document.getElementById('selectedStoreCode').value = code;
      document.getElementById('selectedStoreName').value = name;
      document.getElementById('storeDisplayRow').innerHTML = `<td>${code}</td><td>${name}</td>`;
    }

    function normalizeToKatakana(str) {
      if (!str) return '';
      let kana = str.replace(/[\u3041-\u3096]/g, match => String.fromCharCode(match.charCodeAt(0) + 0x60));
      const kanaMap = {
        'ｶﾞ':'ガ','ｷﾞ':'ギ','ｸﾞ':'グ','ｹﾞ':'ゲ','ｺﾞ':'ゴ','ｻﾞ':'ザ','ｼﾞ':'ジ','ｽﾞ':'ズ','ｾﾞ':'ゼ','ｿﾞ':'ゾ',
        'ﾀﾞ':'ダ','ﾁﾞ':'ヂ','ﾂﾞ':'ヅ','ﾃﾞ':'デ','ﾄﾞ':'ド','ﾊﾞ':'バ','ﾋﾞ':'ビ','ﾌﾞ':'ブ','ﾍﾞ':'ベ','ﾎﾞ':'ボ',
        'ﾊﾟ':'パ','ﾋﾟ':'ピ','ﾌﾟ':'プ','ﾍﾟ':'ペ','ﾎﾟ':'ポ','ｳﾞ':'ヴ','ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ',
        'ｶ':'カ','ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ','ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ',
        'ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト','ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ','ﾉ':'ノ',
        'ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ','ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム','ﾒ':'メ','ﾓ':'モ',
        'ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ','ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ','ﾛ':'ロ','ﾜ':'ワ','ｦ':'ヲ','ﾝ':'ン',
        'ｧ':'ァ','ｨ':'ィ','ｩ':'ゥ','ｪ':'ェ','ｫ':'ォ','ｯ':'ッ','ｬ':'ャ','ｭ':'ュ','ｮ':'ョ','ｰ':'ー'
      };
      const reg = new RegExp(Object.keys(kanaMap).join('|'), 'g');
      return kana.replace(reg, match => kanaMap[match]).toLowerCase();
    }

    function setupStoreSuggest() {
      const input = document.getElementById('storeSearch');
      const suggest = document.getElementById('storeSuggest');

      input.addEventListener('input', () => {
        const keyword = normalizeToKatakana(input.value.trim());
        suggest.innerHTML = '';
        if (!keyword) { suggest.style.display = 'none'; return; }

        const filtered = masterStores.filter(item => {
          const keys = Object.keys(item);
          const code = normalizeToKatakana(String(item[keys[0]] || ''));
          const name = normalizeToKatakana(String(item[keys[1]] || ''));
          return code.includes(keyword) || name.includes(keyword);
        });

        if (filtered.length === 0) {
          suggest.innerHTML = '<div class="suggest-item" style="color:#999;">該当なし</div>';
          suggest.style.display = 'block';
          return;
        }

        filtered.forEach(item => {
          const keys = Object.keys(item);
          const code = String(item[keys[0]] || '').trim();
          const name = String(item[keys[1]] || '').trim();

          const div = document.createElement('div');
          div.className = 'suggest-item';
          div.innerHTML = `<span class="code">${code}</span> ${name}`;
          div.addEventListener('click', () => {
            setStoreSelect(code, name);
            input.value = '';
            suggest.style.display = 'none';
          });
          suggest.appendChild(div);
        });
        suggest.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#storeSearch') && !e.target.closest('#storeSuggest')) suggest.style.display = 'none';
      });
    }

    function setupCustomerSuggest() {
      const input = document.getElementById('customerSearch');
      const suggest = document.getElementById('customerSuggest');
      const codeHidden = document.getElementById('selectedCustomerCode');
      const nameHidden = document.getElementById('selectedCustomerName');
      const routeCodeHidden = document.getElementById('selectedRouteCode');
      const routeNameHidden = document.getElementById('selectedRouteName');
      const staffCodeHidden = document.getElementById('selectedStaffCode');
      const staffNameHidden = document.getElementById('selectedStaffName');
      const displayRow = document.getElementById('customerDisplayRow');

      input.addEventListener('input', () => {
        const keyword = normalizeToKatakana(input.value.trim());
        suggest.innerHTML = '';
        if (!keyword) { suggest.style.display = 'none'; return; }

        const filtered = masterCustomers.filter(item => {
          const vals = Object.values(item).map(v => normalizeToKatakana(String(v)));
          return vals.some(v => v.includes(keyword));
        });

        if (filtered.length === 0) {
          suggest.innerHTML = '<div class="suggest-item" style="color:#999;">該当なし</div>';
          suggest.style.display = 'block';
          return;
        }

        filtered.forEach(item => {
          const keys = Object.keys(item);
          const code = item[keys[0]] || '';
          const name = item[keys[1]] || '';
          const staffCode = item[keys[61]] !== undefined ? String(item[keys[61]]).trim() : '';
          const staffName = masterStaffs[staffCode] || (staffCode ? `未登録 (${staffCode})` : '');
          const storeCodeFromCustomer = item[keys[68]] !== undefined ? String(item[keys[68]]).trim() : '';
          const routeCode = item[keys[70]] !== undefined ? String(item[keys[70]]).trim() : '';
          const routeName = masterRoutes[routeCode] || (routeCode ? `未登録 (${routeCode})` : '');

          const div = document.createElement('div');
          div.className = 'suggest-item';
          div.innerHTML = `<span class="code">${code}</span> ${name}`;

          div.addEventListener('click', () => {
            codeHidden.value = code;
            nameHidden.value = name;
            routeCodeHidden.value = routeCode;
            routeNameHidden.value = routeName;
            staffCodeHidden.value = staffCode;
            if (staffNameHidden) staffNameHidden.value = staffName;

            displayRow.innerHTML = `
              <td>${code}</td><td>${name}</td><td>${routeCode || '-'}</td>
              <td>${routeName || '-'}</td><td>${staffCode || '-'}</td><td>${staffName || '-'}</td>
            `;

            if (storeCodeFromCustomer) {
              const matchedStore = masterStores.find(s => String(s[Object.keys(s)[0]]).trim() === storeCodeFromCustomer);
              if (matchedStore) {
                setStoreSelect(storeCodeFromCustomer, String(matchedStore[Object.keys(matchedStore)[1]] || '').trim());
              } else {
                setStoreSelect(storeCodeFromCustomer, '（店舗名未登録）');
              }
            }

            input.value = '';
            suggest.style.display = 'none';
          });
          suggest.appendChild(div);
        });
        suggest.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#customerSearch') && !e.target.closest('#customerSuggest')) suggest.style.display = 'none';
      });
    }

    const confirmModal = document.getElementById('confirmModal');

    document.getElementById('openConfirmBtn').addEventListener('click', () => {
      const slipDate = document.getElementById('slipDate').value;
      const storeCode = document.getElementById('selectedStoreCode').value;
      const customerCode = document.getElementById('selectedCustomerCode').value;

      if (!slipDate) { alert('伝票日付を入力してください。'); return; }
      if (!currentUserName) { alert('ログインしてください。'); checkLogin(); return; }
      if (!customerCode) { alert('得意先を選択してください。'); return; }
      if (!storeCode) { alert('出荷店を選択してください。'); return; }

      const itemsToSubmit = Array.from(document.querySelectorAll('.container-qty'))
        .filter(input => parseInt(input.value, 10) > 0)
        .map(input => {
          const code = input.dataset.code;
          const item = masterContainers.find(c => String(c[Object.keys(c)[0]]).trim() === code);
          const keys = item ? Object.keys(item) : [];
          return {
            containerCode: code,
            janCode: item ? (item[keys[1]] || '') : '',
            containerName: item ? (item[keys[2]] || '') : '',
            quantity: parseInt(input.value, 10),
            unit: input.dataset.unit || '個'
          };
        });

      if (itemsToSubmit.length === 0) {
        alert('1つ以上の空容器の数量を入力してください。');
        return;
      }

      currentPayload = {
        slipDate: slipDate,
        registrantName: currentUserName,
        storeCode: storeCode,
        storeName: document.getElementById('selectedStoreName').value,
        customerCode: customerCode,
        customerName: document.getElementById('selectedCustomerName').value,
        routeCode: document.getElementById('selectedRouteCode').value,
        routeName: document.getElementById('selectedRouteName').value,
        staffCode: document.getElementById('selectedStaffCode').value,
        staffName: document.getElementById('selectedStaffName') ? document.getElementById('selectedStaffName').value : '',
        note: document.getElementById('note').value,
        items: itemsToSubmit
      };

      document.getElementById('modalSlipDateStr').textContent = currentPayload.slipDate;
      document.getElementById('modalRegistrantStr').textContent = currentPayload.registrantName;
      document.getElementById('modalCustomerStr').textContent = `[${currentPayload.customerCode}] ${currentPayload.customerName}`;
      document.getElementById('modalRouteStr').textContent = currentPayload.routeCode ? `[${currentPayload.routeCode}] ${currentPayload.routeName}` : '未設定';
      document.getElementById('modalStaffStr').textContent = currentPayload.staffCode ? `[${currentPayload.staffCode}] ${currentPayload.staffName}` : '未設定';
      document.getElementById('modalStoreStr').textContent = `[${currentPayload.storeCode}] ${currentPayload.storeName}`;
      document.getElementById('modalNoteStr').textContent = currentPayload.note || '（なし）';

      const itemsBody = document.getElementById('modalItemsBody');
      if (itemsBody) {
        itemsBody.innerHTML = '';
        currentPayload.items.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.containerCode}</td>
            <td>${item.containerName}</td>
            <td style="text-align: right; font-weight: bold;">${item.quantity} ${item.unit}</td>
          `;
          itemsBody.appendChild(tr);
        });
      }

      confirmModal.style.display = 'flex';
    });

    document.getElementById('modalCancelBtn').addEventListener('click', () => { confirmModal.style.display = 'none'; });
    confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) confirmModal.style.display = 'none'; });

    document.getElementById('modalSubmitBtn').addEventListener('click', async () => {
      if (!currentPayload) return;

      const submitBtn = document.getElementById('modalSubmitBtn');
      const cancelBtn = document.getElementById('modalCancelBtn');
      
      submitBtn.disabled = true;
      if (cancelBtn) cancelBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(currentPayload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          submitBtn.textContent = '✓ 送信完了';
          submitBtn.style.backgroundColor = '#28a745';

          document.querySelectorAll('.container-qty').forEach(input => input.value = '');
          document.getElementById('note').value = '';
          document.getElementById('customerSearch').value = '';
          document.getElementById('selectedCustomerCode').value = '';
          document.getElementById('selectedCustomerName').value = '';
          document.getElementById('selectedRouteCode').value = '';
          document.getElementById('selectedRouteName').value = '';
          document.getElementById('selectedStaffCode').value = '';
          
          document.getElementById('customerDisplayRow').innerHTML = '<td colspan="6" style="text-align:center; color:#999;">未選択（左の検索窓から選択）</td>';
          document.getElementById('storeSearch').value = '';
          document.getElementById('selectedStoreCode').value = '';
          document.getElementById('selectedStoreName').value = '';
          document.getElementById('storeDisplayRow').innerHTML = '<td colspan="2" class="empty-td">未選択（得意先選択で自動反映・変更可）</td>';

          currentPayload = null;

          setTimeout(() => {
            confirmModal.style.display = 'none';
            submitBtn.disabled = false;
            if (cancelBtn) cancelBtn.disabled = false;
            submitBtn.textContent = '送信確定';
            submitBtn.style.backgroundColor = '';
          }, 1200);
        } else {
          alert('保存失敗: ' + result.message);
          submitBtn.disabled = false;
          if (cancelBtn) cancelBtn.disabled = false;
          submitBtn.textContent = '送信確定';
        }
      } catch (err) {
        console.error('送信エラー:', err);
        alert('送信エラーが発生しました。');
        submitBtn.disabled = false;
        if (cancelBtn) cancelBtn.disabled = false;
        submitBtn.textContent = '送信確定';
      }
    });
  </script>
</body>
</html>
