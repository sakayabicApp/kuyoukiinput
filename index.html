<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空容器登録アプリ</title>
<style>
  :root {
    --primary-color: #0051c3;
    --bg-color: #f4f7f6;
    --card-bg: #ffffff;
    --border-color: #ccc;
  }
  
  html {
    font-size: 16px; /* 1rem = 16px */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    max-width: 950px;
    margin: 0.9375rem auto; /* 15px */
    padding: 0 0.625rem;    /* 10px */
    color: #333;
  }
  .container {
    background: var(--card-bg);
    padding: 1.25rem;       /* 20px */
    border-radius: 0.5rem;  /* 8px */
    box-shadow: 0 0.125rem 0.5rem rgba(0,0,0,0.1);
  }
  h2 {
    margin-top: 0;
    color: var(--primary-color);
    border-bottom: 2px solid var(--primary-color);
    padding-bottom: 0.5rem; /* 8px */
    font-size: 1.25rem;     /* 20px */
  }

  /* レイアウト（PC: 横並び / スマホ: 1行・縦並び） */
  .search-display-grid {
    display: flex;
    flex-direction: row;
    gap: 0.9375rem;         /* 15px */
    margin-bottom: 1.25rem; /* 20px */
    align-items: flex-start;
  }
  .col-1-3 {
    flex: 1;
    position: relative;
    width: 100%;
  }
  .col-2-3 {
    flex: 2;
    width: 100%;
  }

  label {
    display: block;
    font-weight: bold;
    margin-bottom: 0.375rem; /* 6px */
    font-size: 0.875rem;     /* 14px */
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 0.625rem 0.75rem; /* 10px 12px */
    font-size: 0.9375rem;       /* 15px */
    box-sizing: border-box;
    border: 1px solid var(--border-color);
    border-radius: 0.25rem;
  }

  /* テーブル基本スタイル */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8125rem; /* 13px */
    text-align: left;
  }
  th, td {
    padding: 0.5rem 0.625rem; /* 8px 10px */
    border: 1px solid #e0e0e0;
    vertical-align: middle;
    word-break: break-all;     /* 長い文字列も折り返し */
    white-space: normal;      /* 自動折り返しを許可 */
  }
  th {
    background-color: #f8f9fa;
    color: #555;
    font-weight: bold;
  }

  /* ★ 空容器マスターテーブルの列幅比率固定（PC表示時） ★ */
  .table-container table {
    table-layout: fixed;
    width: 100%;
  }
  .table-container th:nth-child(1) { width: 18%; } /* 商品コード */
  .table-container th:nth-child(2) { width: 22%; } /* JANコード */
  .table-container th:nth-child(3) { width: 33%; } /* 空容器名 */
  .table-container th:nth-child(4) { width: 13%; } /* 単価 */
  .table-container th:nth-child(5) { width: 14%; } /* 数量入力 */

  /* 表示用ミニテーブル */
  .display-table-container {
    background: #ffffff;
    border-radius: 0.25rem;
    overflow-x: auto;
  }
  .display-table td {
    background-color: #f0f4f9;
    color: #1967d2;
    font-weight: bold;
  }
  .display-table td.empty-td {
    background-color: #fafafa;
    color: #888;
    font-weight: normal;
    text-align: center;
  }

  /* スマホ（767px以下）向けのレスポンシブ調整 */
  @media (max-width: 767px) {
    html {
      font-size: 14px; /* 全体のrem基準を少し縮小 */
    }

    .search-display-grid {
      flex-direction: column;
      gap: 0.625rem;
    }

    /* 空容器マスターのJANコード列（2列目）を非表示 */
    #containerTableBody tr td:nth-child(2),
    .table-container th:nth-child(2) {
      display: none;
    }

    /* ★ スマホ時（JAN非表示時）の空容器テーブル列幅比率指定 ★ */
    .table-container th:nth-child(1) { width: 22%; } /* 商品コード */
    .table-container th:nth-child(3) { width: 44%; } /* 空容器名（広めに確保） */
    .table-container th:nth-child(4) { width: 16%; } /* 単価 */
    .table-container th:nth-child(5) { width: 18%; } /* 数量入力 */

    /* ヘッダー・セルの自動折り返し & 幅調整 */
    th, td {
      padding: 0.375rem 0.25rem;
      font-size: 0.75rem;  /* 12px相当 */
    }

    /* ★ 得意先テーブルのコード数値列は1行に収めて見やすく固定 ★ */
    .display-table td:nth-child(1),
    .display-table td:nth-child(3),
    .display-table td:nth-child(5) {
      white-space: nowrap;
      text-align: center;
    }

    .qty-cell {
      gap: 0.25rem;
    }
    .qty-cell input {
      width: 100%;
      max-width: 3.125rem; /* スマホ時50px */
      padding: 0.25rem;
    }
  }

  /* サジェストウィンドウ */
  .suggest-window {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    max-height: 13.75rem;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid var(--primary-color);
    border-top: none;
    border-radius: 0 0 0.375rem 0.375rem;
    box-shadow: 0 0.25rem 0.625rem rgba(0,0,0,0.15);
    z-index: 1000;
    display: none;
  }
  .suggest-item {
    padding: 0.625rem 0.75rem;
    cursor: pointer;
    border-bottom: 1px solid #eee;
    font-size: 0.8125rem;
    /* ★ モバイルでのタップレスポンス向上＆誤作動防止 ★ */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .suggest-item:hover { background-color: #e8f0fe; }
  .suggest-item .code { font-weight: bold; color: var(--primary-color); margin-right: 0.375rem; }

  /* 空容器マスターテーブル */
  .table-container {
    overflow-x: auto;
    margin-top: 0.625rem;
    border: 1px solid #e0e0e0;
    border-radius: 0.375rem;
  }
  .price-col { text-align: right; }
  .qty-cell {
    display: flex;
    align-items: center;
    gap: 0.375rem;
  }
  .qty-cell input {
    padding: 0.375rem;
    text-align: right;
  }
  .unit-text {
    font-size: 0.75rem;
    color: #555;
    white-space: nowrap;
  }

  /* ボタンエリア */
  .action-area {
    margin-top: 1.25rem;
    text-align: right;
  }
  button.btn-primary {
    background-color: var(--primary-color);
    color: white;
    font-size: 1rem;
    font-weight: bold;
    padding: 0.75rem 1.75rem;
    border: none;
    border-radius: 0.25rem;
    cursor: pointer;
    width: 100%;
    max-width: 18.75rem;
    transition: background 0.2s;
    touch-action: manipulation;
  }
  button.btn-primary:hover { background-color: #003da1; }
  button.btn-secondary {
    background-color: #6c757d;
    color: white;
    font-size: 0.9375rem;
    font-weight: bold;
    padding: 0.625rem 1.25rem;
    border: none;
    border-radius: 0.25rem;
    cursor: pointer;
    touch-action: manipulation;
  }

  #message {
    margin-top: 0.9375rem;
    padding: 0.75rem;
    border-radius: 0.25rem;
    display: none;
    font-weight: bold;
  }
  .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

  /* 確認モーダル */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    padding: 0.9375rem;
  }
  .modal-content {
    background: #ffffff;
    width: 100%;
    max-width: 34.375rem;
    border-radius: 0.5rem;
    padding: 1.25rem;
    box-shadow: 0 0.25rem 0.9375rem rgba(0,0,0,0.2);
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-header {
    font-size: 1.125rem;
    font-weight: bold;
    color: var(--primary-color);
    margin-bottom: 0.75rem;
    border-bottom: 1px solid #eee;
    padding-bottom: 0.5rem;
  }
  .confirm-table {
    margin-bottom: 0.9375rem;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.625rem;
    margin-top: 1.25rem;
  }
</style>
</head>
<body>

  <div class="container">
    <h2>空容器登録</h2>

    <form id="registerForm">
      
      <!-- 1. 得意先エリア（上部配置） -->
      <label>得意先選択:</label>
      <div class="search-display-grid">
        <div class="col-1-3">
          <input type="text" id="customerSearch" placeholder="得意先コード・名称・カナ検索" autocomplete="off">
          <div id="customerSuggest" class="suggest-window"></div>
          <input type="hidden" id="selectedCustomerCode" required>
          <input type="hidden" id="selectedCustomerName">
          <input type="hidden" id="selectedRouteCode">
          <input type="hidden" id="selectedRouteName">
          <input type="hidden" id="selectedStaffCode">
        </div>
        <div class="col-2-3">
          <div class="display-table-container">
            <table class="display-table">
              <thead>
                <tr>
                  <th>得意先コード</th>
                  <th>得意先名</th>
                  <th>ルートコード</th>
                  <th>配送ルート名</th>
                  <th>担当者コード</th>
                </tr>
              </thead>
              <tbody>
                <tr id="customerDisplayRow">
                  <td colspan="5" class="empty-td">未選択（左の検索窓から選択）</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 2. 出荷店エリア（下部配置） -->
      <label>出荷店選択:</label>
      <div class="search-display-grid">
        <div class="col-1-3">
          <input type="text" id="storeSearch" placeholder="出荷店コード・名称で検索" autocomplete="off">
          <div id="storeSuggest" class="suggest-window"></div>
          <input type="hidden" id="selectedStoreCode" required>
          <input type="hidden" id="selectedStoreName">
        </div>
        <div class="col-2-3">
          <div class="display-table-container">
            <table class="display-table">
              <thead>
                <tr>
                  <th style="width: 35%;">出荷店コード</th>
                  <th>出荷店名</th>
                </tr>
              </thead>
              <tbody>
                <tr id="storeDisplayRow">
                  <td colspan="2" class="empty-td">未選択（得意先選択で自動反映・変更可）</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 備考欄 -->
      <div style="margin-bottom: 20px;">
        <label for="note">備考 / メモ:</label>
        <input type="text" id="note" placeholder="備考があれば入力">
      </div>

      <!-- 空容器マスターテーブル -->
      <label>空容器数量入力（入力後、下の送信ボタンで確定）:</label>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>商品コード</th>
              <th>JANコード</th>
              <th>空容器名</th>
              <th class="price-col">単価</th>
              <th style="text-align: center;">数量入力</th>
            </tr>
          </thead>
          <tbody id="containerTableBody">
            <tr>
              <td colspan="5" style="text-align:center; color:#888;">マスターデータを読み込んでいます...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 送信確認モーダル呼出ボタン -->
      <div class="action-area">
        <button type="button" id="openConfirmBtn" class="btn-primary">スプレッドシートへ送信する</button>
      </div>
    </form>

    <div id="message"></div>
  </div>

  <!-- 確認モーダルダイアログ -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">送信内容の確認</div>
      <p style="font-size: 14px; margin-bottom: 10px;">以下の内容で送信します。よろしいですか？</p>
      
      <table class="confirm-table">
        <tr>
          <th style="width: 30%;">得意先</th>
          <td id="modalCustomerStr"></td>
        </tr>
        <tr>
          <th>配送ルート</th>
          <td id="modalRouteStr"></td>
        </tr>
        <tr>
          <th>担当者コード</th>
          <td id="modalStaffStr"></td>
        </tr>
        <tr>
          <th>出荷店</th>
          <td id="modalStoreStr"></td>
        </tr>
        <tr>
          <th>備考</th>
          <td id="modalNoteStr"></td>
        </tr>
      </table>

      <label>登録する空容器一覧:</label>
      <div class="table-container" style="max-height: 180px; overflow-y: auto;">
        <table>
          <thead>
            <tr>
              <th>空容器名</th>
              <th style="text-align: right; width: 100px;">数量</th>
            </tr>
          </thead>
          <tbody id="modalItemsBody"></tbody>
        </table>
      </div>

      <div class="modal-actions">
        <button type="button" id="modalCancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="modalSubmitBtn" class="btn-primary" style="width: auto;">送信確定</button>
      </div>
    </div>
  </div>

  <script>
    // ★ご自身の GAS Webアプリ URL を設定してください
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbylyTuJ9jLaUISlpeKI5xVGOoeXl8XMh9e4lM_bmNAPTsw4N8LnVt4m2vDOgqMx7kRZlQ/exec';

    let masterStores = [];
    let masterCustomers = [];
    let masterContainers = [];
    let masterRoutes = {};

    let currentPayload = null;

    // 初期ロード
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const result = await response.json();

        if (result.status === 'success') {
          masterStores = result.data.stores;
          masterCustomers = result.data.customers;
          masterContainers = result.data.containers;

          // ルートマスター辞書マップ (A列:コード -> B列:名称)
          if (result.data.routes) {
            result.data.routes.forEach(row => {
              const keys = Object.keys(row);
              const code = String(row[keys[0]] || '').trim();
              const name = String(row[keys[1]] || '').trim();
              if (code) masterRoutes[code] = name;
            });
          }

          renderContainerTable(masterContainers);
        } else {
          showMessage('マスターデータの取得に失敗しました', true);
        }
      } catch (err) {
        console.error('マスター取得エラー:', err);
        showMessage('通信エラーが発生しました。GASのURL・設定を確認してください。', true);
      }
    });

    // 空容器テーブル描画
    function renderContainerTable(containers) {
      const tbody = document.getElementById('containerTableBody');
      tbody.innerHTML = '';

      if (!containers || containers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">データがありません</td></tr>';
        return;
      }

      containers.forEach(item => {
        const keys = Object.keys(item);
        const code  = item[keys[0]] || ''; 
        const jan   = item[keys[1]] || ''; 
        const name  = item[keys[2]] || ''; 
        const price = item[keys[3]] !== undefined ? item[keys[3]] : ''; 
        const unit  = item[keys[4]] || '個'; 

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${code}</strong></td>
          <td>${jan}</td>
          <td>${name}</td>
          <td class="price-col">${price ? Number(price).toLocaleString() + '円' : ''}</td>
          <td>
            <div class="qty-cell">
              <input type="number" class="container-qty" min="0" placeholder="0" 
                     data-code="${code}" data-name="${name}" data-unit="${unit}">
              <span class="unit-text">${unit}</span>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 出荷店を選択・表示エリアにセットする関数
    function setStoreSelect(code, name) {
      document.getElementById('selectedStoreCode').value = code;
      document.getElementById('selectedStoreName').value = name;
      document.getElementById('storeDisplayRow').innerHTML = `<td>${code}</td><td>${name}</td>`;
    }

    // 出荷店サジェストセットアップ
    function setupStoreSuggest() {
      const input = document.getElementById('storeSearch');
      const suggest = document.getElementById('storeSuggest');

      input.addEventListener('input', () => {
        const keyword = input.value.trim().toLowerCase();
        suggest.innerHTML = '';
        if (!keyword) { suggest.style.display = 'none'; return; }

        const filtered = masterStores.filter(item => {
          const vals = Object.values(item).map(v => String(v).toLowerCase());
          return (vals[0] && vals[0].includes(keyword)) || (vals[1] && vals[1].includes(keyword));
        });

        if (filtered.length === 0) {
          suggest.innerHTML = '<div class="suggest-item" style="color:#999;">該当なし</div>';
          suggest.style.display = 'block';
          return;
        }

        filtered.forEach(item => {
          const keys = Object.keys(item);
          const code = String(item[keys[0]] || '').trim();
          const name = String(item[keys[1]] || '').trim();

          const div = document.createElement('div');
          div.className = 'suggest-item';
          div.innerHTML = `<span class="code">${code}</span> ${name}`;

          div.addEventListener('click', () => {
            setStoreSelect(code, name);
            input.value = '';
            suggest.style.display = 'none';
          });
          suggest.appendChild(div);
        });
        suggest.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#storeSearch') && !e.target.closest('#storeSuggest')) suggest.style.display = 'none';
      });
    }

    // 得意先サジェストセットアップ
    function setupCustomerSuggest() {
      const input = document.getElementById('customerSearch');
      const suggest = document.getElementById('customerSuggest');
      const codeHidden = document.getElementById('selectedCustomerCode');
      const nameHidden = document.getElementById('selectedCustomerName');
      const routeCodeHidden = document.getElementById('selectedRouteCode');
      const routeNameHidden = document.getElementById('selectedRouteName');
      const staffCodeHidden = document.getElementById('selectedStaffCode');
      const displayRow = document.getElementById('customerDisplayRow');

      input.addEventListener('input', () => {
        const keyword = input.value.trim().toLowerCase();
        suggest.innerHTML = '';
        if (!keyword) { suggest.style.display = 'none'; return; }

        const filtered = masterCustomers.filter(item => {
          const vals = Object.values(item).map(v => String(v).toLowerCase());
          return (vals[0] && vals[0].includes(keyword)) || 
                 (vals[1] && vals[1].includes(keyword)) || 
                 (vals[2] && vals[2].includes(keyword));
        });

        if (filtered.length === 0) {
          suggest.innerHTML = '<div class="suggest-item" style="color:#999;">該当なし</div>';
          suggest.style.display = 'block';
          return;
        }

        filtered.forEach(item => {
          const keys = Object.keys(item);
          const code = item[keys[0]] || '';
          const name = item[keys[1]] || '';
          
          // BJ列（62列目 = インデックス 61）: 担当者コード
          const staffCode = item[keys[61]] !== undefined ? String(item[keys[61]]).trim() : '';
          
          // ★ BQ列（69列目 = インデックス 68）: 出荷店コード ★
          const storeCodeFromCustomer = item[keys[68]] !== undefined ? String(item[keys[68]]).trim() : '';

          // BS列（71列目 = インデックス 70）: ルートコード
          const routeCode = item[keys[70]] !== undefined ? String(item[keys[70]]).trim() : '';
          const routeName = masterRoutes[routeCode] || (routeCode ? `未登録 (${routeCode})` : '');

          const div = document.createElement('div');
          div.className = 'suggest-item';
          div.innerHTML = `<span class="code">${code}</span> ${name}`;

          div.addEventListener('click', () => {
            codeHidden.value = code;
            nameHidden.value = name;
            routeCodeHidden.value = routeCode;
            routeNameHidden.value = routeName;
            staffCodeHidden.value = staffCode;

            // 得意先表示テーブルの更新
            displayRow.innerHTML = `
              <td>${code}</td>
              <td>${name}</td>
              <td>${routeCode || '-'}</td>
              <td>${routeName || '-'}</td>
              <td>${staffCode || '-'}</td>
            `;

            // ★ BQ列の出荷店コードを元に出荷店マスターから検索して自動入力 ★
            if (storeCodeFromCustomer) {
              const matchedStore = masterStores.find(s => {
                const sKeys = Object.keys(s);
                return String(s[sKeys[0]]).trim() === storeCodeFromCustomer;
              });
              
              if (matchedStore) {
                const storeName = String(matchedStore[Object.keys(matchedStore)[1]] || '').trim();
                setStoreSelect(storeCodeFromCustomer, storeName);
              } else {
                // 出荷店名が見つからなくてもコード自体は反映
                setStoreSelect(storeCodeFromCustomer, '（店舗名未登録）');
              }
            }

            input.value = '';
            suggest.style.display = 'none';
          });
          suggest.appendChild(div);
        });
        suggest.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#customerSearch') && !e.target.closest('#customerSuggest')) suggest.style.display = 'none';
      });
    }

    setupStoreSuggest();
    setupCustomerSuggest();

    // モーダル制御・送信処理
    const confirmModal = document.getElementById('confirmModal');

    document.getElementById('openConfirmBtn').addEventListener('click', () => {
      const storeCode = document.getElementById('selectedStoreCode').value;
      const customerCode = document.getElementById('selectedCustomerCode').value;

      if (!customerCode) {
        alert('得意先を選択してください。');
        return;
      }
      if (!storeCode) {
        alert('出荷店を選択してください。');
        return;
      }

      const qtyInputs = document.querySelectorAll('.container-qty');
      const itemsToSubmit = [];

      qtyInputs.forEach(input => {
        const qty = parseInt(input.value, 10);
        if (qty > 0) {
          itemsToSubmit.push({
            containerCode: input.dataset.code,
            containerName: input.dataset.name,
            quantity: qty,
            unit: input.dataset.unit
          });
        }
      });

      if (itemsToSubmit.length === 0) {
        alert('1つ以上の空容器の数量を入力してください。');
        return;
      }

      currentPayload = {
        storeCode: storeCode,
        storeName: document.getElementById('selectedStoreName').value,
        customerCode: customerCode,
        customerName: document.getElementById('selectedCustomerName').value,
        routeCode: document.getElementById('selectedRouteCode').value,
        routeName: document.getElementById('selectedRouteName').value,
        staffCode: document.getElementById('selectedStaffCode').value,
        note: document.getElementById('note').value,
        items: itemsToSubmit
      };

      document.getElementById('modalCustomerStr').textContent = `[${currentPayload.customerCode}] ${currentPayload.customerName}`;
      document.getElementById('modalRouteStr').textContent = currentPayload.routeCode ? `[${currentPayload.routeCode}] ${currentPayload.routeName}` : '未設定';
      document.getElementById('modalStaffStr').textContent = currentPayload.staffCode || '未設定';
      document.getElementById('modalStoreStr').textContent = `[${currentPayload.storeCode}] ${currentPayload.storeName}`;
      document.getElementById('modalNoteStr').textContent = currentPayload.note || '（なし）';

      const itemsBody = document.getElementById('modalItemsBody');
      itemsBody.innerHTML = '';
      currentPayload.items.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.containerName}</td>
          <td style="text-align: right; font-weight: bold;">${item.quantity} ${item.unit}</td>
        `;
        itemsBody.appendChild(tr);
      });

      confirmModal.style.display = 'flex';
    });

    document.getElementById('modalCancelBtn').addEventListener('click', () => {
      confirmModal.style.display = 'none';
    });

    confirmModal.addEventListener('click', (e) => {
      if (e.target === confirmModal) confirmModal.style.display = 'none';
    });

    // 送信確定
    document.getElementById('modalSubmitBtn').addEventListener('click', async () => {
      if (!currentPayload) return;

      const submitBtn = document.getElementById('modalSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(currentPayload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          confirmModal.style.display = 'none';
          showMessage('スプレッドシートへの登録が完了しました！', false);
          
          document.querySelectorAll('.container-qty').forEach(input => input.value = '');
          document.getElementById('note').value = '';
          currentPayload = null;
        } else {
          alert('保存失敗: ' + result.message);
        }
      } catch (err) {
        alert('送信エラーが発生しました。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '送信確定';
      }
    });

    function showMessage(msg, isError) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = isError ? 'error' : 'success';
      msgDiv.style.display = 'block';
    }
  </script>
</body>
</html>
